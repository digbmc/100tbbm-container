<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
    {% include sidebar.html %}
    <button class="sidebar-toggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="sidebar">
    </button>
    <main>
        {% include header.html %}
        <div id="main-content">
            <div id="loader-container" class=""><div class="loader"></div></div>
            <div id="iframe-container" class="hidden">
                <iframe id="main-iframe" title="About this Bryn Mawr" src="{{ page.iframe-src }}" onload="reveal()"></iframe>
            </div>
        </div>
        {% include footer.html %}
    </main>
</body>
</html>

<script>
    // JavaScript for the Main Button

    var button = document.getElementById("main-button");
    var loader = document.getElementById("loader-container");
    var iframe = document.getElementById("main-iframe");
    var iframeContainer = document.getElementById("iframe-container");

    function loading(){
        // hide the iframe
        iframeContainer.classList.add("hidden");
        // show the loader
        loader.classList.remove("hidden");
        // reload the iframe by "changing" src
        iframe.src = iframe.src;
        console.log("Loading...");
    }

    function reveal(){
        // hide the loader
        loader.classList.add("hidden");
        // show the iframe
        iframeContainer.classList.remove("hidden");
        console.log("Done loading!");
    }

    // Support sidebar toggle
    (function(document) {
      var toggle = document.querySelector('.sidebar-toggle');
      var sidebar = document.querySelector('#sidebar');
      var sidebarNavLink = document.querySelector('.sidebar-nav-item');
      var checkbox = document.querySelector('#sidebar-checkbox');
      
      // Toggle sidebar
      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        checkbox.checked = !checkbox.checked;
        toggle.setAttribute('aria-expanded', checkbox.checked);
        sidebar.setAttribute('aria-hidden', !checkbox.checked);
      });
      
      // Make sure we focus on the menu once it opens to aid tab navigation
      sidebar.addEventListener('transitionend', function() {sidebarNavLink.focus()});
      
      // Clicking anywhere in the sidebar should close the menu
      sidebar.addEventListener('click', function(e) {
        checkbox.checked = false;
        toggle.setAttribute('aria-expanded', false);
        sidebar.setAttribute('aria-hidden', true);
      })
    })(document);
</script>
